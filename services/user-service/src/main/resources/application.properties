spring.application.name=user-service
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
app.service-name=user-service
app.private-key=${SERVICE_PRIVATE_KEY}
app.user-public-key=${USER_PUBLIC_KEY}
app.product-public-key=${PRODUCT_PUBLIC_KEY}
app.trade-public-key=${TRADE_PUBLIC_KEY}
app.user-url=${USER_SERVICE_URL:http://user-service:8080}
app.product-url=${PRODUCT_SERVICE_URL:http://product-service:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.trade-url=${TRADE_SERVICE_URL:http://trade-service:8080}
app.upload-dir=${UPLOAD_DIR:./uploads}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
management.info.env.enabled=true
info.app.version=${APP_VERSION:local-development}

app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap-admin.identifier=${ADMIN_BOOTSTRAP_IDENTIFIER:}
app.bootstrap-admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
