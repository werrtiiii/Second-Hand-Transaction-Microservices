name: secondhand-microservices
x-app: &app
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment: &keys
    USER_PUBLIC_KEY: ${USER_PUBLIC_KEY:?generate .env first}
    PRODUCT_PUBLIC_KEY: ${PRODUCT_PUBLIC_KEY:?generate .env first}
    TRADE_PUBLIC_KEY: ${TRADE_PUBLIC_KEY:?generate .env first}
    USER_SERVICE_URL: http://user-service:8080
    PRODUCT_SERVICE_URL: http://product-service:8080
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?generate .env first}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?generate .env first}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?generate .env first}
      TRADE_DB_PASSWORD: ${TRADE_DB_PASSWORD:?generate .env first}
    volumes:
      - microservice-data:/var/lib/mysql
      - ./db/microservices-init.sh:/docker-entrypoint-initdb.d/00-microservices.sh:ro
      - ./db/user/V001__phase1.sql:/schemas/user.sql:ro
      - ./db/product/V001__phase1.sql:/schemas/product.sql:ro
      - ./db/trade/V001__phase1.sql:/schemas/trade.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  user-service:
    <<: *app
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports: ["127.0.0.1:18081:8080"]
    environment:
      <<: *keys
      SERVICE_PRIVATE_KEY: ${USER_PRIVATE_KEY:?generate .env first}
      DB_URL: jdbc:mysql://mysql:3306/secondhand_user?allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: user_app
      DB_PASSWORD: ${USER_DB_PASSWORD}
  product-service:
    <<: *app
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    ports: ["127.0.0.1:18082:8080"]
    environment:
      <<: *keys
      SERVICE_PRIVATE_KEY: ${PRODUCT_PRIVATE_KEY:?generate .env first}
      DB_URL: jdbc:mysql://mysql:3306/secondhand_product?allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: product_app
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
  trade-service:
    <<: *app
    build:
      context: .
      dockerfile: services/trade-service/Dockerfile
    ports: ["127.0.0.1:18083:8080"]
    environment:
      <<: *keys
      SERVICE_PRIVATE_KEY: ${TRADE_PRIVATE_KEY:?generate .env first}
      DB_URL: jdbc:mysql://mysql:3306/secondhand_trade?allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: trade_app
      DB_PASSWORD: ${TRADE_DB_PASSWORD}
volumes:
  microservice-data:
