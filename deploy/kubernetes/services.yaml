apiVersion: v1
kind: Namespace
metadata:
  name: secondhand-microservices

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: user-uploads, namespace: secondhand-microservices}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}

---
apiVersion: apps/v1
kind: Deployment
metadata: {name: user-service, namespace: secondhand-microservices}
spec:
  replicas: 1
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: app
          image: IMAGE_PREFIX/user-service:VERSION_TAG
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, failureThreshold: 60, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5}
          envFrom:
            - configMapRef: {name: service-public-config}
            - secretRef: {name: user-service-secrets}
          env:
            - name: APP_VERSION
              value: VERSION_TAG
            - name: DB_USERNAME
              value: user_app
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/secondhand_user?allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
            - name: UPLOAD_DIR
              value: /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: user-uploads}

---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: secondhand-microservices}
spec:
  selector: {app: user-service}
  ports: [{port: 8080, targetPort: 8080}]

