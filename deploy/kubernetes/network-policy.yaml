apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: isolated-business-services, namespace: secondhand-microservices}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 3306}]
  egress:
    - to:
        - podSelector: {}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 3306}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-ingress, namespace: secondhand-microservices}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
